name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.2.3
      source_commit:
        description: Full commit SHA to build and tag
        required: true

permissions:
  contents: write

concurrency:
  group: nicroute-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out exact application source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          path: build
          persist-credentials: false
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.100
      - name: Pin SDK for this build
        shell: pwsh
        working-directory: build
        run: |
          @{ sdk = @{ version = '10.0.100'; rollForward = 'disable' } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8
      - name: Build and package
        shell: pwsh
        working-directory: build
        run: ./scripts/Build.ps1 -SelfContained
      - name: Run actual engine integration tests without TUN
        shell: pwsh
        working-directory: build
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          dotnet run --project tests/NICRoute.Tests -c Release --no-build -- --engine "$PWD/engine/sing-box.exe" --integration --traffic --applications --firewall
          if ($LASTEXITCODE -ne 0) { throw 'Engine integration tests failed.' }
      - name: Verify updater restart and rollback in isolated fixtures
        shell: pwsh
        working-directory: build
        run: |
          if (Test-Path scripts/Verify-Updater.ps1) { ./scripts/Verify-Updater.ps1 }
      - name: Verify actual MUDL download
        shell: pwsh
        working-directory: build
        run: |
          if (Test-Path engine/mudl.exe) {
            dotnet run --project tests/NICRoute.Tests -c Release --no-build -- --mudl "$PWD/engine/mudl.exe"
            if ($LASTEXITCODE -ne 0) { throw 'MUDL integration failed.' }
          }
      - name: Verify published WPF application starts
        shell: pwsh
        working-directory: build
        run: |
          $preview = Join-Path $PWD 'artifacts/published-preview.png'
          $app = Start-Process -FilePath './dist/NICRoute-win-x64/NICRoute.exe' -ArgumentList @('--preview', $preview, '--verify-rules', '--verify-traffic', '--app-traffic-tab', '--verify-applications') -WindowStyle Hidden -PassThru
          if (-not $app.WaitForExit(30000)) { $app.Kill(); throw 'Published application startup timed out.' }
          if ($app.ExitCode -ne 0 -or -not (Test-Path $preview)) { throw 'Published application startup failed.' }
          if (Test-Path ($preview + '.checks.txt')) { Get-Content ($preview + '.checks.txt') }
      - name: Upload verified assets and publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-Release.ps1 -ArtifactDirectory ./build/dist -Tag $env:RELEASE_TAG -TargetCommit $env:SOURCE_COMMIT
      - name: Verify published update feed with the client
        shell: pwsh
        working-directory: build
        run: |
          $tool = './tools/NICRoute.UpdateTool/bin/Release/net10.0-windows/NICRoute.UpdateTool.dll'
          if ((Test-Path $tool) -and -not $env:RELEASE_TAG.Contains('-')) {
            dotnet $tool check-live "$PWD/artifacts/live-update-state"
            if ($LASTEXITCODE -ne 0) { throw 'Published update feed was rejected by the client.' }
          }
